name: "Setup JDK"
description: "Set up JDK and Gradle caching"

inputs:
  java-version:
    description: "Java version"
    default: "21"

runs:
  using: "composite"
  steps:
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v5.0.0

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5.2.0
      with:
        distribution: corretto
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5.0.0
      with:
        gradle-version: wrapper
        # Only main-branch builds write to the Gradle cache; PR builds read it.
        # Keeps short-lived PR entries from evicting the shared cache (10 GB repo limit).
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Set konan cache key
      id: konan-cache-key
      shell: bash
      # POSIX character classes rather than `\s`, which is a GNU extension: this step now runs on
      # macOS runners too, and relying on one grep implementation's extras across two is a bet with
      # no upside. An empty read fails the step rather than silently collapsing the cache key to a
      # constant, which would look like a working cache while never matching anything.
      run: |
        version="$(grep -oE 'kotlin[[:space:]]*=[[:space:]]*"[0-9.]+"' gradle/libs.versions.toml | head -1 | grep -oE '[0-9]+(\.[0-9]+)*')"
        if [ -z "$version" ]; then
          echo "Could not read the Kotlin version from gradle/libs.versions.toml" >&2
          exit 1
        fi
        echo "KOTLIN_VERSION=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Konan
      uses: actions/cache@v5.0.2
      with:
        path: |
          ~/.konan
        # Keyed on the Kotlin version alone: that is what decides the konan toolchain and the
        # platform libraries under ~/.konan. An earlier key also hashed `.xcode-version`, a file this
        # repository does not have — so it hashed to a constant and narrowed nothing.
        key: v2-konan-${{ runner.os }}-${{ steps.konan-cache-key.outputs.KOTLIN_VERSION }}
        # Warm start after a Kotlin bump instead of re-downloading everything.
        restore-keys: |
          v2-konan-${{ runner.os }}-
