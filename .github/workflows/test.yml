name: Run Test

on:
  # Unfiltered on main so every merge seeds the Gradle cache for PR builds.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'
      - 'assets/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A check from an empty Gradle cache takes about 17 minutes; without a limit, a hung browser test
    # holds the runner for six hours.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java

      # The Kotlin daemon otherwise inherits the Gradle daemon's -Xmx8G, and the two can claim the
      # runner's whole 16 GB. The user home reaches every build in the composite: a Kotlin daemon
      # started with a larger heap would be reused for every smaller request.
      - name: Cap the Kotlin daemon heap
        run: echo "kotlin.daemon.jvmargs=-Xmx3g" >> "$GRADLE_USER_HOME/gradle.properties"

      - name: Run tests
        run: ./gradlew check

      # Taken while the Gradle and Kotlin daemons are still up, so it shows how close the build
      # comes to the runner's 16 GB and which process holds it.
      - name: Report memory and disk
        if: ${{ !cancelled() }}
        run: |
          free -m
          df -h /
          ps -eo rss=,args= | sort -rn | head -n 8 | awk '{
            xmx = ""; main = $2
            for (i = 2; i <= NF; i++) {
              if ($i ~ /^-Xmx/) xmx = $i
              if ($i ~ /(GradleDaemon|KotlinCompileDaemon|GradleWorkerMain)$/) main = $i
            }
            printf "%6d MB  %-8s %s\n", $1 / 1024, xmx, main
          }'
          for pid in $(pgrep -f 'GradleDaemon|KotlinCompileDaemon'); do
            jcmd "$pid" GC.heap_info | grep -E '^[0-9]+:|heap|Gen' || true
          done

  # A job of its own rather than a second step in `test`. `check` on the root build does not descend
  # into included builds — it pulls in the agent plugin's jar, because the demo consumes it, but none
  # of its tests — so these have to be asked for separately. Running them beside the root build
  # rather than after it keeps two Gradle daemons and the compiler test framework off one runner's
  # memory, and the two finish in parallel.
  agent-plugin:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java

      - name: Run agent plugin tests
        run: ./gradlew -p jetwhale-agent-plugin check

  # Kotlin/Native cannot build Apple targets on Linux, so the two jobs above skip every one of them —
  # including `jetwhale-agent-runtime`'s appleMain, which reads `sockaddr_in` bytes positionally and
  # subclasses two Objective-C delegate protocols. Without this job that code is first compiled by the
  # release tag build, which is the worst place to discover it does not.
  #
  # macOS runners bill at a multiple of Linux ones, so this compiles and tests rather than running the
  # whole `check` the Linux job already covers. Warm, it is well under a minute.
  apple:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java

      - name: Compile Apple targets
        run: >
          ./gradlew
          compileKotlinIosArm64
          compileKotlinIosSimulatorArm64
          compileKotlinMacosArm64
          allMetadataJar

      - name: Run Apple tests
        run: ./gradlew macosArm64Test iosSimulatorArm64Test

  # Publishes the JVM and Android variants (and the root module files) to Maven Local, unsigned, and
  # checks them for the lint plugin leaking into what apps and host plugins consume: a Kotrail
  # dependency in a POM or module file, or Kotrail annotations in an Android artifact that lacks the
  # consumer rule R8 needs. Apple variants are left to the release build; their klibs only warn.
  published-artifacts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java

      - name: Publish to Maven Local
        run: >
          ./gradlew
          --init-script .github/scripts/no-signing.init.gradle.kts
          -PjetwhaleSnapshot
          publishAndroidPublicationToMavenLocal
          publishJvmPublicationToMavenLocal
          publishKotlinMultiplatformPublicationToMavenLocal
          publishMavenPublicationToMavenLocal

      - name: Check the published artifacts
        run: |
          version="$(sed -n 's/^jetwhale = "\(.*\)"$/\1/p' gradle/libs.versions.toml)-SNAPSHOT"
          .github/scripts/check-published-artifacts.sh "$version"
