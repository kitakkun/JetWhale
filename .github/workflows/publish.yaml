name: Publish

on:
  push:
    tags:
      - "*"
jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    environment: Publish
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      # Fails when gradle/published-versions.properties does not describe a releasable state, e.g.
      # `prepareRelease` was never run for this train version. Offline, so it costs nothing.
      - name: Verify the release plan
        run: ./gradlew verifyReleasePlan --no-configuration-cache
      # Publishes only the artifacts whose recorded version equals this train version. Maven Central
      # bills publishers on file count, so unchanged artifacts stay at the version they already have.
      - name: Publish changed artifacts to MavenCentral
        run: ./gradlew publishChangedToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
      # The Gradle plugins live in included builds, whose tasks are not part of the root build's
      # publish tasks, so publish them explicitly — and only when this release moves them, which the
      # root build cannot decide for a separate build.
      - name: Publish host Gradle plugin to MavenCentral
        run: ./.github/scripts/publish-included-build.sh jetwhale-gradle-plugin jetwhale-host-gradle-plugin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
      # The agent compiler plugin and its Gradle plugin share a build. The Gradle plugin names the
      # compiler plugin's coordinates in getPluginArtifact(), so the release plan republishes the
      # Gradle plugin whenever the compiler plugin moves — either artifact being due publishes both,
      # which is what keeps those coordinates resolvable.
      - name: Publish agent compiler + Gradle plugin to MavenCentral
        run: ./.github/scripts/publish-included-build.sh jetwhale-agent-plugin jetwhale-agent-compiler-plugin jetwhale-agent-gradle-plugin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
