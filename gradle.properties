# gradle
org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# android
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The Kotrail compiler plugin build that goes with the Gradle plugin pinned in libs.versions.toml
# (the plugin would otherwise compose <kotlin>-0.1.0-SNAPSHOT and take whatever is newest).
kotrail.compilerPluginVersion=2.4.10-0.1.0-20260924.054154-14
